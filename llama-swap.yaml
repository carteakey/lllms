      --alias ggml-org/gpt-oss-120b
      --fit on --fit-ctx 32678 --fit-target 512
      --no-mmap
      --threads 10 --threads-batch 12 --flash-attn on
      --batch-size 2048 --ubatch-size 512 --prio 2 --no-warmup
      --temp 1.0 --top-k 100 --min-p 0.0 --top-p 1.0
      --jinja --reasoning-format none
      --chat-template-kwargs '{"reasoning_effort":"low"}'
      --chat-template-file ${chat_template}
      --host 0.0.0.0 --port ${PORT}

  "gpt-oss-20b":
    name: "gpt-oss 20B"
    env:
      - "LLAMA_SET_ROWS=1"
    cmd: |
      ${llama_server}
      -m /mnt/lab/models/ggml-org/gpt-oss-20b-GGUF/gpt-oss-20b-mxfp4.gguf
      --n-cpu-moe 4 --ctx-size 32000 --n-gpu-layers 99
      --temp 1.0 --min-p 0.0 --top-p 1.0 --top-k 20
      --flash-attn --jinja --reasoning-format none
      --chat-template-file ${chat_template}
      --chat-template-kwargs '{"reasoning_effort": "high"}'
      --host 0.0.0.0 --port ${PORT}

  "gpt-oss-puzzle-88b":
    name: "gpt-oss-puzzle 88B (optimized, bench-derived static placement)"
    description: "pp=549 tg=27.0 t/s. Requires the PR-21032 llama.cpp build."
    env:
      - "LLAMA_SET_ROWS=1"
      - "GGML_CUDA_GRAPH_OPT=1"
    cmd: |
      taskset -c ${cpu_range} ${puzzle_server}
      -m /home/kchauhan/models/SamPurkis/gpt-oss-puzzle-88B-GGUF/gpt-oss-puzzle-88B.MXFP4_MOE.gguf
      --alias SamPurkis/gpt-oss-puzzle-88B
      -ngl 37
      --override-tensor "blk\.4\.ffn_down.*=CPU,blk\.(5|[6-9]|[0-9][0-9]|[0-9][0-9][0-9])\.ffn_(up|down|gate_up|gate)_(ch|)exps=CPU"
      --no-mmap
      -ctk q8_0 -ctv q8_0
      --ctx-size 32768 --parallel 1
      --flash-attn on
      --batch-size 2048 --ubatch-size 512
      --threads 10 --threads-batch 12
      --prio 2 --no-warmup
      --temp 1.0 --min-p 0.0 --top-p 1.0
      --jinja --reasoning-format none
      --chat-template-kwargs '{"reasoning_effort":"high"}'
      --chat-template-file ${chat_template}
      --host 0.0.0.0 --port ${PORT}

  "gpt-oss-puzzle-88b-legacy":
