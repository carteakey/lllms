# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# L3MS llama-swap configuration
# -----------------------------
# Single source of truth for serving. Replaces run-models/*.sh.
# See configuration.md (in-repo) for schema reference.
#
# ${env.L3MS_ROOT} must point at the repo root on the serving host
# (e.g. /home/kchauhan/repos/l3ms on the Linux box). llama-swap evaluates
# env macros before config load; startup fails loudly if it is unset.

healthCheckTimeout: 500
logLevel: info
logToStdout: both

# upstream ${PORT} auto-increments from here; llama-swap itself listens on 8080
startPort: 10001

# globalTTL: auto-unload idle models after 10 minutes to free VRAM. Override
# per-model with ttl: 0 to pin.
globalTTL: 600

sendLoadingState: true

macros:
  # --- binary paths ---
  "llama_server":  "${env.L3MS_ROOT}/vendor/llama.cpp/build/bin/llama-server"
  "ik_server":     "${env.L3MS_ROOT}/vendor/ik_llama.cpp/build/bin/llama-server"
  "puzzle_server": "${env.L3MS_ROOT}/vendor/llama.cpp-pr-test-21032/build/bin/llama-server"
  "sarvam_server": "${env.L3MS_ROOT}/vendor/llama.cpp-pr-test-20275/build/bin/llama-server"

  # --- shared paths ---
  "chat_template": "${env.L3MS_ROOT}/chat-template.jinja"

  # --- taskset wrapper (empty if CPU_RANGE unset) ---
  "cpu_range": "0-11"

models:

  # ===========================================================================
  # gpt-oss family
  # ===========================================================================

  "gpt-oss-120b":
    name: "gpt-oss 120B (optimized, bench-derived static placement, reasoning=high)"
    description: "Production default. pp=427 tg=23.4 t/s. See docs/bench-runbook.md §8."
    env:
      - "LLAMA_SET_ROWS=1"
      - "GGML_CUDA_GRAPH_OPT=1"
    cmd: |
      taskset -c ${cpu_range} ${llama_server}
      -m /mnt/lab/models/ggml-org/gpt-oss-120b-GGUF/gpt-oss-120b-mxfp4-00001-of-00003.gguf
      --alias ggml-org/gpt-oss-120b
      # bench-derived static split: blk 0-4 on GPU, blk 5+ experts on CPU
      -ngl 37
      --override-tensor "blk\.(5|[6-9]|[0-9][0-9]|[0-9][0-9][0-9])\.ffn_(up|down|gate)_(ch|)exps=CPU"
      --no-mmap
      -ctk q8_0 -ctv q8_0
      --ctx-size 32768 --parallel 1
      --flash-attn on
      --batch-size 2048 --ubatch-size 512
      --threads 10 --threads-batch 12
      --temp 1.0 --min-p 0.0 --top-p 1.0
      --host 0.0.0.0 --port ${PORT}
      --no-warmup --jinja --reasoning-format none
      --chat-template-file ${chat_template}
    filters:
      setParamsByID:
        "${MODEL_ID}":      { chat_template_kwargs: { reasoning_effort: high } }
        "${MODEL_ID}:high": { chat_template_kwargs: { reasoning_effort: high } }
        "${MODEL_ID}:med":  { chat_template_kwargs: { reasoning_effort: medium } }
        "${MODEL_ID}:low":  { chat_template_kwargs: { reasoning_effort: low } }

  "gpt-oss-120b-legacy":
    name: "gpt-oss 120B (legacy, --fit auto-placement)"
    description: "Pre-optimized variant using --fit. Keep for regression comparison."
    unlisted: true
    env:
      - "LLAMA_SET_ROWS=1"
      - "GGML_CUDA_GRAPH_OPT=1"
    cmd: |
      taskset -c ${cpu_range} ${llama_server}
      -m /mnt/lab/models/ggml-org/gpt-oss-120b-GGUF/gpt-oss-120b-mxfp4-00001-of-00003.gguf
      --alias ggml-org/gpt-oss-120b
      --fit on --fit-ctx 32678 --fit-target 512
      --no-mmap
      -ctk q8_0 -ctv q8_0
      --threads 10 --threads-batch 12 --flash-attn on
      --batch-size 2048 --ubatch-size 512
      --prio 2 --no-warmup
      --temp 1.0 --min-p 0.0 --top-p 1.0
      --jinja --reasoning-format none
      --chat-template-kwargs '{"reasoning_effort":"high"}'
      --chat-template-file ${chat_template}
      --host 0.0.0.0 --port ${PORT}

  "gpt-oss-120b-low":
    name: "gpt-oss 120B (legacy --fit, reasoning=low)"
    description: "Lower-latency variant. Preserved from run-llama-cpp-gpt-oss-low-120b.sh."
    unlisted: true
    env:
      - "LLAMA_SET_ROWS=1"
      - "GGML_CUDA_GRAPH_OPT=1"
    cmd: |
      taskset -c ${cpu_range} ${llama_server}
