      --no-mmap
      -ctk q8_0 -ctv q8_0
      --threads 10 --threads-batch 12 --flash-attn on
      --batch-size 2048 --ubatch-size 512 --parallel 1
      --prio 2 --no-warmup
      --temp 1.0 --min-p 0.0 --top-p 1.0 --jinja
      --host 0.0.0.0 --port ${PORT}

  # ===========================================================================
  # Qwen3 Coder Next (80B.A3B)
  # ===========================================================================

  "qwen3-coder-next":
    name: "Qwen3-Coder-Next 80B.A3B (optimized, bench-derived static placement)"
    description: "Default coder. pp=502 tg=39.6 t/s @ 64k ctx. See bench-runbook.md §8."
    env:
      - "LLAMA_SET_ROWS=1"
      # GRAPH_OPT=0: CUDA graph re-capture can OOM with tight VRAM headroom
      - "GGML_CUDA_GRAPH_OPT=0"
    cmd: |
      taskset -c ${cpu_range} ${llama_server}
      -m /mnt/lab/models/unsloth/Qwen3-Coder-Next-GGUF/Qwen3-Coder-Next-UD-Q4_K_XL.gguf
      --alias unsloth/Qwen3-Coder-Next
      # bench-derived (FIT_CTX=65536 + q8_0 KV + 512 MiB margin)
      -ngl 49
      --override-tensor "blk\.7\.ffn_down.*=CPU,blk\.([89]|[1-9][0-9])\.ffn_(up|down|gate)_(ch|)exps=CPU"
      --no-mmap --mlock
      -ctk q8_0 -ctv q8_0
      --ctx-size 65536 --parallel 1
      --threads 10 --threads-batch 12
      --flash-attn on
      --batch-size 2048 --ubatch-size 512
      --seed 3407
      --temp 1.0 --top-p 0.95 --min-p 0.01 --top-k 40 --repeat-penalty 1
      --host 0.0.0.0 --port ${PORT}
      --jinja --prio 2 --no-warmup

  "qwen3-coder-next-legacy":
